<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>niko 陈列三维模型</title><style>*{box-sizing:border-box}body{margin:0;background:#f0eee8;font:12px -apple-system,'PingFang SC',sans-serif;color:#34453c}canvas{display:block}#controls{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:center;gap:5px;flex-wrap:wrap}select{font:inherit;border:0;background:transparent;color:inherit;padding:3px}.scope-control{background:#fff;border:1px solid #d6dbd1;border-radius:5px;padding:4px 8px}.embed .scope-control{display:none}button,a{font:inherit;border:1px solid #d6dbd1;border-radius:5px;background:#fffffff0;color:#34453c;padding:7px 10px;cursor:pointer;text-decoration:none}button.active{background:#304e3d;color:white}#state{position:absolute;top:15px;left:17px;pointer-events:none;font-size:11px;line-height:1.7}#state strong{font-size:15px;display:block;font-weight:500}.tag{position:absolute;pointer-events:none;font-size:11px;background:#fffC;padding:4px 7px;border-radius:2px}.render #controls,.render #state{display:none}#busy{position:absolute;inset:0;display:grid;place-content:center;pointer-events:none;color:#7c857a}</style><div id="state"></div><div id="busy">载入三维模型…</div><div class="tag" id="person">170cm</div><div class="tag" id="base">200 × 100 × 67cm</div><div class="tag" id="column">127cm 占位 · 截面待核</div><div id="controls"><label class="scope-control">查看 <select id="scope"><option value="overall">整体</option><option value="island">中岛</option><option value="column">柱子区</option></select></label><button data-view="front">正面</button><button data-view="back">背面</button><button data-view="angle">斜视</button><button id="person-toggle">人物</button><a id="download" download>GLB ↓</a></div><script type="module">
import * as THREE from './vendor/three.module.js';import{OrbitControls}from './vendor/OrbitControls.js';import{GLTFLoader}from './vendor/GLTFLoader.js';
const q=new URLSearchParams(location.search),scheme=q.get('scheme')==='pipe'?'pipe':'paper';if(q.has('render'))document.body.classList.add('render');if(q.has('embed'))document.body.classList.add('embed');
let zone=q.get('zone')||'overall',angle='angle',person=true,model;const scene=new THREE.Scene();scene.background=new THREE.Color('#f0eee8');const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.02,80);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x9d9687,2));const light=new THREE.DirectionalLight(0xfff2dd,2.8);light.position.set(-3,7,5);light.castShadow=true;light.shadow.mapSize.set(2048,2048);Object.assign(light.shadow.camera,{left:-6,right:6,top:6,bottom:-6});light.shadow.bias=-.00015;scene.add(light);const fill=new THREE.DirectionalLight(0xffffff,1.7);fill.position.set(5,4,-5);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:'#e5e0d7',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.001;floor.receiveShadow=true;scene.add(floor);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2-.02;controls.minDistance=1.3;controls.maxDistance=15;
const headerGroup=new THREE.Group();scene.add(headerGroup);function header(text,w,h,pos,rot){const c=document.createElement('canvas');c.width=1024;c.height=128;const ctx=c.getContext('2d');ctx.font='500 70px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff8df';ctx.fillText(text,512,64);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent:true,toneMapped:false,depthWrite:false}));m.position.set(...pos);m.rotation.y=rot;headerGroup.add(m);}header('POPSTICKER',.95,.08,[2.425,1.92,.282],0);header('ARTSTICKER',.95,.08,[1.642,1.92,-.5],-Math.PI/2);
const iscol=o=>o.name.startsWith('column_')||o.name.startsWith('existing_column');const isHuman=o=>o.name.startsWith('human_');
function tint(o){if(o.material.map){o.material=new THREE.MeshBasicMaterial({map:o.material.map,side:o.material.side,toneMapped:false});return;}o.geometry.computeVertexNormals();let n=o.name,c='#c6a16b';if(n.startsWith('pallet_'))c=n.includes('top')?'#8c9b90':n.includes('foot')||n.includes('riser')?'#4a504b':'#a77948';if(n.startsWith('column_')&&n.includes('panel'))c=scheme==='pipe'?'#ac7e4e':'#f1f0ea';if(n.startsWith('paper_printable_'))c='#f1f0ea';if(n.startsWith('paper_exposed_'))c=n.includes('seam')?'#94774d':'#b19367';if(n.startsWith('existing_column'))c='#bab5aa';if(n.startsWith('human_'))c='#8a9998';if(n.startsWith('pipe_')||n.startsWith('column_stand_')||n.includes('hook'))c='#8c989e';if(n.includes('red_header'))c='#b02838';if(n.includes('green_header'))c='#215740';o.material=new THREE.MeshStandardMaterial({color:c,roughness:n.startsWith('pipe_')?.35:.9,metalness:n.startsWith('pipe_')?.2:0,flatShading:!isHuman(o),transparent:n.startsWith('existing_column'),opacity:n.startsWith('existing_column')?.16:1,depthWrite:!n.startsWith('existing_column')});}
function update(){headerGroup.visible=zone!=='island';if(model)model.traverse(o=>{if(o.isMesh)o.visible=iscol(o)?zone!=='island':isHuman(o)?person&&zone!=='column':zone!=='column';});document.querySelector('#state').innerHTML='<strong>'+(scheme==='pipe'?'A · 海洋板方案':'B · 纸板方案')+'</strong>'+({island:'中岛 · 叉车板底座高 67cm',column:'柱子区 · 四脚落地水管支架',overall:'中岛 + 柱子区'})[zone];document.querySelector('#scope').value=zone;document.querySelector('#person').hidden=zone==='column'||!person;document.querySelector('#base').hidden=zone==='column';document.querySelector('#column').hidden=zone==='island';}
function setView(z=zone,a=angle){zone=z;angle=a;let target,pos;if(z==='island'){target=[-.23,1.03,0];pos=a==='front'?[-.23,1.25,5.8]:a==='back'?[-.23,1.25,-5.8]:[2.8,2.35,4.3];}else if(z==='column'){target=[2.4,1.1,-.45];pos=a==='front'?[2.425,1.6,4.6]:a==='back'?[-2.5,1.6,-.5]:[-1.1,2.1,4.25];}else{target=[.7,1.25,-.25];pos=a==='back'?[6.3,3.4,-6.5]:[-4,3.5,7.5];}controls.target.set(...target);camera.position.set(...pos);controls.update();update();}window.setView=setView;window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='niko-zone'&&['island','column','overall'].includes(e.data.zone))setView(e.data.zone,'angle');});
new GLTFLoader().load('models/'+scheme+'.glb',g=>{model=g.scene;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;tint(o);}});scene.add(model);setView();document.querySelector('#busy').remove();window.ready=true;},undefined,e=>{document.querySelector('#busy').textContent='模型未能载入：'+e.message;});
document.querySelector('#scope').onchange=e=>setView(e.target.value,'angle');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(zone,b.dataset.view));document.querySelector('#person-toggle').onclick=()=>{person=!person;update();};document.querySelector('#download').href='models/'+scheme+'.glb';
function label(id,p){let v=p.clone().project(camera),e=document.getElementById(id);e.style.left=Math.max(8,Math.min(innerWidth-e.offsetWidth-8,(v.x*.5+.5)*innerWidth))+'px';e.style.top=Math.max(8,Math.min(innerHeight-e.offsetHeight-8,(-v.y*.5+.5)*innerHeight))+'px';}
function loop(){requestAnimationFrame(loop);controls.update();label('person',new THREE.Vector3(-1.43,1.8,0));label('base',new THREE.Vector3(-.1,.31,.55));label('column',new THREE.Vector3(2.425,.4,.27));renderer.render(scene,camera);}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});window.scene=scene;window.getScheme=()=>({scheme,zone});
</script></html>
