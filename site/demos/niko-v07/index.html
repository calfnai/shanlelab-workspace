<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHANLE LAB × niko and…｜新稿三维预览 v07</title><style>*{box-sizing:border-box}body{margin:0;background:#eeece6;color:#273633;font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}header{position:absolute;top:22px;left:28px;z-index:2}h1{font-size:19px;margin:6px 0;font-weight:600}small{font-size:11px;letter-spacing:2px;color:#758078}.sub{font-size:12px;line-height:1.9;color:#67716c}nav{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:7px;background:#ffffffde;border-radius:12px;z-index:3;white-space:nowrap}button,a{border:0;background:#e9ede8;color:#263d31;padding:10px 14px;border-radius:6px;text-decoration:none;cursor:pointer;font:inherit}button:hover,a:hover{background:#d9e1d7}.note{position:absolute;bottom:90px;left:28px;font-size:11px;color:#6b746e;line-height:1.8}canvas{display:block}.tag{position:absolute;pointer-events:none;font-size:12px;background:#fffC;padding:4px 7px;color:#4a5b53;border-radius:3px}#loading{position:absolute;inset:0;display:grid;place-content:center;pointer-events:none}@media(max-width:600px){header{left:16px;top:12px}h1{font-size:15px}.sub{font-size:10px}nav{bottom:16px;gap:4px}button,a{font-size:11px;padding:9px}.note{left:16px;font-size:10px}}</style>
<header><small>SHANLE LAB × niko and… / V07</small><h1>圣诞双面陈列 · 新稿套用</h1><div class="sub">桌面 200 × 100cm · 外阶 +10cm / 内阶 +20cm<br>原图直接贴入 · 同地面 170cm 人物参照</div></header><div id="loading">正在载入三维模型…</div><div class="tag" id="person">170cm</div><div class="tag" id="width">200cm</div><nav><button data-view="front">正面</button><button data-view="back">背面</button><button data-view="angle">三维角度</button><button id="human">隐藏人物</button><a href="model.glb" download>下载 GLB</a></nav><div class="note">拖动旋转 · 滚轮缩放<br>立板约 139 × 100cm，总高约 180cm（按新稿比例暂定）<br>预留 2 款小包、5 款护照夹样品；此图先核对画面及空间比例。</div>
<script type="module">
import * as THREE from './vendor/three.module.js';
import {OrbitControls} from './vendor/OrbitControls.js';
import {GLTFLoader} from './vendor/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#eeece6');
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.01,50);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x9f978a,2.5));const sun=new THREE.DirectionalLight(0xfff3df,3.1);sun.position.set(-3,6,4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-4;sun.shadow.camera.right=4;sun.shadow.camera.top=4;sun.shadow.camera.bottom=-4;sun.shadow.bias=-.0003;scene.add(sun);
const fill=new THREE.DirectionalLight(0xffffff,1.8);fill.position.set(3,3,-5);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#e6e2da',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.002;floor.receiveShadow=true;scene.add(floor);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(-.23,.88,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2-.01;controls.minDistance=1.8;controls.maxDistance=12;
function view(v){const p={front:[-.23,1.35,5.4],back:[-.23,1.4,-5.4],angle:[3.05,2.4,4.3]}[v];camera.position.set(...p);controls.target.set(-.23,.88,0);controls.update();}window.setView=view;view('angle');
let model;new GLTFLoader().load('model.glb',g=>{model=g.scene;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material.map){o.material=new THREE.MeshBasicMaterial({map:o.material.map,side:o.material.side,toneMapped:false});}else{o.geometry.computeVertexNormals();o.material=new THREE.MeshStandardMaterial({color:o.name.startsWith('human_')?'#879599':o.name.startsWith('table_leg')?'#585c57':o.name.startsWith('table_')?'#8d7960':o.name.startsWith('laminated')?'#a18355':'#bd9b63',roughness:.9,metalness:0,flatShading:!o.name.startsWith('human_')});}}});scene.add(model);document.querySelector('#loading').remove();window.ready=true;},undefined,e=>{document.querySelector('#loading').textContent='载入失败：'+e.message;});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));let visible=true;document.querySelector('#human').onclick=e=>{visible=!visible;model?.traverse(o=>{if(o.name.startsWith('human_'))o.visible=visible;});e.target.textContent=visible?'隐藏人物':'显示人物';document.querySelector('#person').hidden=!visible;};
function tag(id,p){const v=p.clone().project(camera),e=document.getElementById(id);e.style.left=(v.x*.5+.5)*innerWidth+'px';e.style.top=(-v.y*.5+.5)*innerHeight+'px';}
function loop(){requestAnimationFrame(loop);controls.update();tag('person',new THREE.Vector3(-1.43,1.78,0));tag('width',new THREE.Vector3(0,.58,.61));renderer.render(scene,camera);}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});window.scene=scene;
</script></html>
