<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><defs><linearGradient id="mirror" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c7d5d5"/><stop offset=".32" stop-color="#f7faf8"/><stop offset=".36" stop-color="#abb8b6"/><stop offset=".65" stop-color="#f1f5f1"/><stop offset="1" stop-color="#9faba9"/></linearGradient></defs><rect width="1400" height="800" fill="#f5f3ef"/><g font-family="sans-serif" fill="#303b35"><text x="64" y="70" font-size="32">凌序 · 可拆卸线缆</text><text x="64" y="110" font-size="19" fill="#68766d">机底镜面保持完整，撤回盘线、理线夹与插头停靠</text><rect x="155" y="160" width="330" height="520" rx="12" fill="#bfc4c2" stroke="#738078" stroke-width="2"/><rect x="177" y="180" width="286" height="365" rx="3" fill="url(#mirror)"/><text x="246" y="355" font-size="24">镜面底面</text><rect x="180" y="566" width="280" height="94" rx="8" fill="#4d5651"/><text x="225" y="620" font-size="20" fill="#fff">机头／电机区域</text><rect x="485" y="588" width="28" height="40" rx="4" fill="#263c32"/><path d="M520 608H660" stroke="#6b8374" stroke-width="3" stroke-dasharray="9 7"/><path d="M645 597L663 608L645 619" fill="none" stroke="#6b8374" stroke-width="3"/><rect x="690" y="587" width="65" height="42" rx="5" fill="#344b40"/><path d="M755 608C840 608 830 465 945 465S1060 600 1140 600" fill="none" stroke="#344b40" stroke-width="10"/><rect x="1137" y="578" width="68" height="42" rx="6" fill="#344b40"/><path d="M1205 588h25m-25 20h25" stroke="#929c94" stroke-width="7"/><text x="677" y="350" font-size="27">从机身端拔下，线缆单独收纳</text><text x="677" y="390" font-size="20" fill="#68766d">接口设于机身边界，避开中央镜面</text><text x="677" y="680" font-size="18" fill="#68766d">接口位置与具体规格待核验 · 非尺寸图</text><text x="64" y="755" font-size="17" fill="#68766d">分区与拆卸关系示意；不表示整机折叠或竖放机构已经成立</text></g></svg>
