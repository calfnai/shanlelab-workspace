<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#f6f5f0"/><g font-family="PingFang SC,Arial,sans-serif" fill="#303d38"><text x="50" y="68" font-size="32" font-weight="700">凌序 · 实体按钮与竖放收线</text><text x="50" y="103" font-size="18" fill="#7c7566">新增布置提议 · 位置、内部传动、线长及弯曲半径待工程核验</text><rect x="35" y="140" width="610" height="670" rx="20" fill="#e9eae3"/><rect x="670" y="140" width="695" height="670" rx="20" fill="#e9eae3"/><text x="65" y="185" font-size="24" font-weight="700">01 / 上部解锁按钮位置</text><path d="M170 670 L245 360 Q250 300 315 305 L525 330" stroke="#adb3b0" stroke-width="64" fill="none" stroke-linecap="round"/><path d="M290 330 L520 356" stroke="#373e3d" stroke-width="46" stroke-linecap="round"/><circle cx="263" cy="335" r="30" fill="#87918b"/><circle cx="263" cy="335" r="21" fill="#3d6858"/><path d="M263 335 L390 255 L570 255" fill="none" stroke="#3d6858" stroke-width="2"/><text x="345" y="240" font-size="20">内凹按压面 · 位置提议</text><path d="M155 345 L222 338" stroke="#b0784d" stroke-width="5"/><path d="M210 327 L225 338 L211 350" fill="none" stroke="#b0784d" stroke-width="4"/><text x="70" y="325" font-size="20">向内按</text><text x="75" y="735" font-size="19">按钮按压 → 内部锁止释放（传动待设计）</text><text x="75" y="772" font-size="18">左右联动与下轴释放方式未定，不表示整机已解锁</text><text x="705" y="185" font-size="24" font-weight="700">02 / 竖放时 · 机底局部收线</text><rect x="830" y="230" width="305" height="510" rx="35" fill="#b6bcb6" stroke="#6f7b73" stroke-width="3"/><rect x="855" y="250" width="255" height="465" rx="25" fill="#d0d3c9"/><rect x="858" y="645" width="250" height="66" rx="20" fill="#969f95"/><path d="M1078 678 L1092 660 L1092 323 Q1092 302 1072 302 L1052 302" stroke="#315f55" stroke-width="7" fill="none"/><g fill="none" stroke="#315f55" stroke-width="6"><ellipse cx="980" cy="440" rx="74" ry="119"/><ellipse cx="980" cy="440" rx="64" ry="110"/><ellipse cx="980" cy="440" rx="54" ry="101"/></g><g fill="#809b88"><rect x="1081" y="350" width="22" height="24" rx="4"/><rect x="1081" y="540" width="22" height="24" rx="4"/></g><rect x="1037" y="288" width="33" height="28" rx="4" fill="#34423a"/><path d="M1045 288 V275 M1060 288 V275" stroke="#777e76" stroke-width="4"/><g stroke="#668575" stroke-width="2" fill="none"><path d="M1093 365 H1200"/><path d="M1055 302 L1180 260"/><path d="M1080 678 L1210 650"/><path d="M926 455 L735 455"/></g><g font-size="18"><text x="1180" y="245">① 先拔插头</text><text x="1200" y="356">③ 理线夹</text><text x="1170" y="635">出线口提议</text><text x="695" y="440">② 松弯盘线</text><text x="705" y="780">④ 插头停靠；避开底脚、抬升架与接地位置</text></g><text x="50" y="860" font-size="20" fill="#946545">只画竖置的机底局部说明走线；未恢复被否决的整机折叠与竖放动作。</text></g></svg>