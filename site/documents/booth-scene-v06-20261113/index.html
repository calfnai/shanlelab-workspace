<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>整体效果：纸中岛＋3×3米背景布</title><style>body{max-width:1400px;margin:28px auto;padding:20px;background:#000f1d;color:white;font:18px system-ui}img{width:100%;display:block;margin:25px 0}a{color:#42ffef}</style><h1>整个展位：一个纸中岛＋一片3×3米背景布</h1><p>背景布在后，带左右双开储物门的纸中岛在前；暂留约1米后侧浏览取货空间。画面表达前后摆放与品牌层级，不恢复重型墙柜。POPSTICKER蓝橙视觉锤放在布面高处。</p><img src="01-overall-scene.png" alt="纸中岛前置、背景布在后方的展位整体效果"><p>整体空间效果待评审，桌高80cm、门尺寸与间距仍为暂拟；商品及印刷画面以原资产为准，渲染不作为实测和生产证明。画面沿用同对话已有MLBB两款展示联名关系。底部无木托盘；仍仅一个中岛和一片布，布架是必要固定支撑。</p><p><a href="../booth-designer-dimensions-v05-20261113/index.html">设计师尺寸册与柜门标注</a> · <a href="scene-brief.txt">摆位说明</a></p>
