<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>成都款 · 三套椭圆包装贴纸</title>
  <style>
    :root { --ink:#1a2922; --paper:#f4efdf; }
    * { box-sizing:border-box; }
    html,body { margin:0; }
    body { font-family:"Helvetica Neue","PingFang SC","Noto Sans CJK SC",sans-serif; color:var(--ink); background:#e4e0d5; }
    main { width:1600px; height:860px; margin:auto; padding:42px 53px; background:radial-gradient(ellipse at 50% 44%,#f5f2e8,#dedbd0 78%); }
    header { display:flex; justify-content:space-between; align-items:end; border-bottom:2px solid #213c30; padding-bottom:15px; }
    header strong { font-size:21px; letter-spacing:.05em; }
    header span { font-size:12px; text-align:right; font-weight:900; letter-spacing:.15em; }
    h1 { margin:28px 0 8px; font-size:45px; letter-spacing:-.06em; line-height:1; }
    .lead { margin:0; font-size:18px; color:#4c5a50; }
    .products { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:40px; }
    .product { min-width:0; text-align:center; }
    .package { --accent:#204564; --base:#f5f0df; position:relative; width:470px; height:380px; margin:auto; border-radius:50% / 48%; overflow:hidden; background:var(--base); border:6px solid #fbf9f1; box-shadow:0 0 0 2px #afb8ad,0 15px 8px -7px #6f796f60,0 26px 26px #3c483b2c; }
    .package.panda { --accent:#215b43; --base:#eff2dc; }
    .package.life { --accent:#c84a2f; --base:#f6edda; }
    .package::before,.package::after { content:""; position:absolute; top:113px; bottom:65px; width:12px; border-radius:50%; background:var(--accent); }
    .package::before { left:19px; } .package::after { right:19px; }
    .hanger { position:absolute; top:7px; left:50%; transform:translateX(-50%); width:23px; height:23px; border-radius:50%; background:#dfddd3; border:3px solid #c5c8b9; box-shadow:inset 0 2px 3px #4352463e; }
    .topmark { position:absolute; top:33px; left:70px; right:70px; display:flex; align-items:center; justify-content:space-between; gap:6px; font-size:10px; font-weight:900; white-space:nowrap; letter-spacing:.015em; }
    .topmark b { background:var(--accent); color:#fff; padding:5px 7px; line-height:1; font-size:10px; }
    .title { position:absolute; top:59px; left:0; right:0; font-size:22px; font-weight:1000; color:var(--accent); letter-spacing:.08em; }
    .strips { position:absolute; top:87px; left:76px; right:76px; display:grid; gap:4px; }
    .strip { display:block; width:100%; height:76px; overflow:hidden; border-radius:999px; background:#eee8d9; box-shadow:0 3px 2px #19291d25,0 5px 9px #19291d25; }
    .strip svg { width:100%; height:100%; display:block; }
    .bottommark { position:absolute; bottom:26px; left:0; right:0; font-size:10px; font-weight:900; letter-spacing:.14em; color:var(--accent); }
    .product h2 { margin:29px 0 5px; font-size:27px; letter-spacing:-.03em; }
    .product p { margin:0; font-size:15px; color:#586359; }
    .idx { display:inline-block; border-bottom:3px solid var(--accent); padding-bottom:3px; }
    .product.city { --accent:#204564; }.product.panda { --accent:#215b43; }.product.life { --accent:#c84a2f; }
    footer { border-top:1px solid #aeb8aa; margin-top:46px; padding-top:16px; display:flex; justify-content:space-between; gap:20px; font-size:13px; color:#536057; }
    body.solo main { width:600px; height:600px; padding:30px 22px; }
    body.solo header,body.solo h1,body.solo .lead,body.solo footer { display:none; }
    body.solo .products { display:block; margin-top:55px; }
    body.solo .product { display:none; }
    body.solo .product.selected { display:block; }
  </style>
</head>
<body>
<main>
  <header><strong>SHANLE LAB × 2C2D</strong><span>POP STICKER / CHENGDU<br>THREE OVAL SETS · V03</span></header>
  <h1>成都款 · 三套贴纸</h1>
  <p class="lead">9 条黄框图案，按每套 3 条重新分成 3 个独立产品；每套都保留椭圆包装。</p>
  <section class="products" id="products" aria-label="三套椭圆包装"></section>
  <footer><span>每套 3 条 · 合计 3 套 · 选中原图案未重画</span><span>合作标识、尺寸与印刷文件待双方确认 · 产品概念图</span></footer>
</main>
<script>
const source='../原始九宫格.jpg';
const crops={
  '01':[385,550,1215,760], '02':[3620,315,4360,510], '03':[395,1860,1210,2090],
  '04':[1980,1330,2840,1570], '05':[1980,1600,2850,1820], '06':[420,2510,1280,2745],
  '07':[450,2980,1250,3200], '08':[2050,2470,2820,2690], '09':[2050,2915,2820,3135]
};
const sets=[
  {key:'city',name:'成都 · 城市',sub:'字形、街景与夜色',ids:['01','05','07'],num:'01 / CITY'},
  {key:'panda',name:'成都 · 熊猫',sub:'三种轻松的熊猫状态',ids:['02','04','06'],num:'02 / PANDA'},
  {key:'life',name:'成都 · 巴适',sub:'日常心情与火锅热气',ids:['03','08','09'],num:'03 / LIFE'}
];
function strip(id) {
  const [x1,y1,x2,y2]=crops[id];
  return `<div class="strip" aria-label="黄框图案 ${id}"><svg viewBox="${x1} ${y1} ${x2-x1} ${y2-y1}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="黄框图案 ${id}"><image href="${source}" x="0" y="0" width="4913" height="3447"/></svg></div>`;
}
document.getElementById('products').innerHTML=sets.map(s=>`<article class="product ${s.key}" data-key="${s.key}"><div class="package ${s.key}"><div class="hanger"></div><div class="topmark"><span>SHANLE LAB × 2C2D</span><b>POP STICKER</b></div><div class="title">${s.name}</div><div class="strips">${s.ids.map(strip).join('')}</div><div class="bottommark">CHENGDU · THREE SELECTED DESIGNS</div></div><h2><span class="idx">${s.name}</span></h2><p>${s.sub}　·　黄框 ${s.ids.join(' / ')}</p></article>`).join('');
const only=new URLSearchParams(location.search).get('card');
if(only && sets.some(s=>s.key===only)) { document.body.classList.add('solo'); document.querySelector(`[data-key="${only}"]`).classList.add('selected'); }
function fit() {
  const isSolo=document.body.classList.contains('solo');
  const width=isSolo?600:1600, height=isSolo?600:860;
  const scale=Math.min(1,innerWidth/width);
  document.querySelector('main').style.transform=`scale(${scale})`;
  document.querySelector('main').style.transformOrigin='top left';
  document.body.style.height=`${height*scale}px`;
}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
