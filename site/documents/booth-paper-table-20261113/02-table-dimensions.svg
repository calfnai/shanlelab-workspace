<text x="55" y="760" class="label">CONFIRMED CHANGE</text><text x="55" y="801" class="small">Paper tabletop + inset paper support. No wooden pallets.</text><text x="55" y="838" class="small">Upper oval display and front/back merchandise roles stay.</text><text x="55" y="920" class="small">* 1400 × 500 mm support is a provisional user proposal, not a fabrication approval.</text><text x="55" y="957" class="small">Table height, paper reinforcement, shelf/merchandise loads and stability remain to be confirmed.</text></svg>