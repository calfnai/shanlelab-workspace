<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:Arial,sans-serif;fill:#f2f4f1}.label{font-size:24px;font-weight:bold}.dim{font-size:22px;fill:#42ffef}.small{font-size:18px;fill:#b6c8d0}</style><rect width="1600" height="1000" fill="#000f1d"/><text x="55" y="65" font-size="36" font-weight="bold">PAPER TABLE / RECESSED PEDESTAL</text><text x="55" y="105" class="small">One double-sided paper island + one fabric backdrop / No forklift pallets</text>
<text x="55" y="175" class="label">01 / TOP VIEW</text><rect x="80" y="240" width="700" height="350" rx="2" fill="#f4f2e9"/><rect x="185" y="327.5" width="490" height="175" fill="#c6a97a" stroke="#f16b16" stroke-width="3" stroke-dasharray="10 6"/><text x="430" y="424" text-anchor="middle" font-size="25" fill="#000f1d" style="fill:#000f1d">1400 × 500 mm pedestal*</text><text x="430" y="218" text-anchor="middle" class="dim">2000 mm tabletop</text><text x="45" y="425" class="dim" text-anchor="middle" transform="rotate(-90 45 425)">1000 mm tabletop</text><text x="130" y="620" text-anchor="middle" class="dim">300 mm</text><text x="725" y="620" text-anchor="middle" class="dim">300 mm</text><text x="430" y="291" text-anchor="middle" font-size="19" style="fill:#000f1d">250 mm foot recess</text><text x="430" y="553" text-anchor="middle" font-size="19" style="fill:#000f1d">250 mm foot recess</text><text x="80" y="676" class="small">Dashed shape = support below tabletop, centered on both axes.</text>
